<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3a"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="bubble" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </radialGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="drum" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- ambient shapes -->
  <circle cx="90" cy="110" r="240" fill="#ffffff" opacity="0.045"/>
  <circle cx="1150" cy="840" r="320" fill="#ffffff" opacity="0.05"/>
  <circle cx="980" cy="90" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="220" cy="820" r="170" fill="#0d9488" opacity="0.22"/>
  <circle cx="620" cy="450" r="70" fill="#ffffff" opacity="0.05"/>

  <!-- clothesline -->
  <line x1="150" y1="360" x2="1040" y2="300" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <line x1="1040" y1="300" x2="1060" y2="300" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>

  <!-- hanging t-shirts -->
  <g transform="translate(240,352) rotate(-5)">
    <rect x="6" y="-14" width="10" height="20" rx="3" fill="#fbbf24" opacity="0.85"/>
    <path d="M12 -6 L34 -16 L52 -2 L58 -2 L76 -16 L98 -6 L91 20 L78 15 L78 64 L34 64 L34 15 L21 20 Z"
      fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <g transform="translate(520,334) rotate(-2)">
    <rect x="6" y="-14" width="10" height="20" rx="3" fill="#2dd4bf" opacity="0.85"/>
    <path d="M12 -6 L34 -16 L52 -2 L58 -2 L76 -16 L98 -6 L91 20 L78 15 L78 64 L34 64 L34 15 L21 20 Z"
      fill="#fef3c7" stroke="#d97706" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <g transform="translate(800,318) rotate(-4)">
    <rect x="6" y="-14" width="10" height="20" rx="3" fill="#f472b6" opacity="0.85"/>
    <path d="M12 -6 L34 -16 L52 -2 L58 -2 L76 -16 L98 -6 L91 20 L78 15 L78 64 L34 64 L34 15 L21 20 Z"
      fill="#ffffff" stroke="#0f766e" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- front-load washing machine -->
  <g transform="translate(850,470)">
    <rect x="0" y="0" width="230" height="240" rx="30" fill="url(#machine)" stroke="#475569" stroke-opacity="0.55"/>
    <circle cx="112" cy="118" r="82" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="112" cy="118" r="64" fill="url(#drum)"/>
    <circle cx="90" cy="98" r="12" fill="#0ea5e9" opacity="0.65"/>
    <circle cx="134" cy="104" r="9" fill="#0ea5e9" opacity="0.6"/>
    <circle cx="112" cy="144" r="11" fill="#0ea5e9" opacity="0.6"/>
    <circle cx="78" cy="140" r="7" fill="#0ea5e9" opacity="0.5"/>
    <rect x="176" y="36" width="38" height="38" rx="9" fill="#94a3b8"/>
    <circle cx="195" cy="55" r="9" fill="#e2e8f0"/>
    <circle cx="195" cy="55" r="4" fill="#0ea5e9"/>
    <rect x="26" y="216" width="18" height="16" rx="4" fill="#64748b"/>
    <rect x="186" y="216" width="18" height="16" rx="4" fill="#64748b"/>
  </g>

  <!-- soap bubbles -->
  <circle cx="700" cy="430" r="28" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="762" cy="384" r="18" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="636" cy="470" r="13" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="884" cy="352" r="11" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.3"/>
  <circle cx="730" cy="500" r="8" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.3"/>

  <!-- detergent bottle -->
  <g transform="translate(1050,700)">
    <rect x="0" y="40" width="46" height="96" rx="12" fill="#f59e0b"/>
    <path d="M10 40 Q8 16 20 8 L26 8 Q38 16 36 40 Z" fill="#fbbf24"/>
    <rect x="16" y="0" width="14" height="12" rx="4" fill="#b45309"/>
    <text x="23" y="96" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fef3c7" text-anchor="middle">CUCI</text>
  </g>
</svg>